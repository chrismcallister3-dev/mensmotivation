<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#161819"><title>Men’s Motivation</title><style>*{box-sizing:border-box}body{margin:0;background:#161819;color:#f4f1eb;font:16px/1.55 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:32px 20px 110px}header,article{border-bottom:1px solid #414345;padding:0 0 22px}h1{font-size:clamp(32px,7vw,48px);letter-spacing:-1.5px;margin:0}h3{font-size:22px;line-height:1.3;margin:7px 0}p{color:#c4c5c5;margin:8px 0}small{color:#d3b78c;text-transform:uppercase;letter-spacing:1px;font-size:11px}button,input{font:inherit;border:1px solid #555;background:#282b2d;color:#fff;border-radius:22px;padding:9px 14px}button{cursor:pointer}button[aria-pressed=true],#refresh{background:#dfc69e;color:#161819;border-color:#dfc69e}button:disabled{opacity:.5}#tags{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}form{display:flex;gap:8px}input{min-width:0;flex:1}article{padding:24px 0}a{color:#e3c99e;text-underline-offset:4px}footer{position:fixed;bottom:0;left:0;right:0;background:#161819f5;border-top:1px solid #414345;padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center}#refresh{width:min(100%,680px);font-weight:700}#status,.note{font-size:13px}</style><main><header><small>Personal inspiration board</small><h1>Men’s Motivation</h1><p>Ideas worth reflecting on. Stories worth sharing.</p></header><div id="tags"></div><form id="add"><input id="topic" placeholder="Add a topic" aria-label="Add a topic" maxlength="60"><button>Add</button></form><h2>Discover</h2><p id="status" role="status" aria-live="polite"></p><section id="cards"></section><p class="note">Live sources: Google Books, Apple Podcasts and Wikipedia. Source descriptions and excerpts are not verified quotations or AI analysis. Video links open topic searches.</p></main><footer><button id="refresh">↻ Discover new content</button></footer><script>
const $=id=>document.getElementById(id), defaults=['Masculinity','Discipline','Resilience','Purpose','Fatherhood','Brotherhood','Personal growth','Motivation','Inspiration'];function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}let tags=read('mm-tags',defaults),active=new Set(read('mm-active',tags)),seen=new Set(read('mm-seen',[])),current=read('mm-current',[]);function el(t,s){let n=document.createElement(t);n.textContent=s;return n}function excerpt(s){s=new DOMParser().parseFromString(String(s||''),'text/html').body.textContent.replace(/\s+/g,' ').trim();return s.length>330?s.slice(0,327)+'…':s}function renderTags(){$('tags').replaceChildren();tags.forEach(t=>{let b=el('button',t);b.setAttribute('aria-pressed',active.has(t));b.onclick=()=>{active.has(t)?active.delete(t):active.add(t);save('mm-active',[...active]);renderTags()};$('tags').append(b)})}function render(items){$('cards').replaceChildren();items.forEach(x=>{let a=el('article',''),l=el('a','Explore source ↗');try{let u=new URL(x.url);if(u.protocol==='https:'){l.href=u.href;l.target='_blank';l.rel='noopener noreferrer'}}catch{}a.append(el('small',x.type+' · '+x.tag),el('h3',x.title),el('p',x.desc),l);$('cards').append(a)})}const seeds=[{type:'Book · editorial idea',tag:'Discipline',title:'Focus on what you can control',desc:'An idea from Stoic philosophy: invest effort in your judgments and actions rather than outcomes beyond your control.',url:'https://www.gutenberg.org/ebooks/2680'},{type:'Book · editorial idea',tag:'Purpose',title:'Find meaning in your response to adversity',desc:'A theme associated with Viktor Frankl: even when circumstances cannot be changed, our response can matter.',url:'https://www.viktorfrankl.org/'},{type:'Story · editorial idea',tag:'Resilience',title:'Leadership through endurance',desc:'The story of Ernest Shackleton invites reflection on responsibility and perseverance under extreme pressure.',url:'https://en.wikipedia.org/wiki/Imperial_Trans-Antarctic_Expedition'}];
async function json(url){let c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);try{let r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(timer)}}
function podcast(q){return new Promise((resolve,reject)=>{let name='mmcb'+Math.random().toString(36).slice(2),s=document.createElement('script'),timer=setTimeout(()=>{cleanup();reject(Error('Podcast timeout'))},10000);function cleanup(){clearTimeout(timer);s.remove();delete window[name]}window[name]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(Error('Podcast unavailable'))};s.src='https://itunes.apple.com/search?media=podcast&entity=podcast&limit=40&term='+encodeURIComponent(q)+'&callback='+name;document.head.append(s)})}
async function sources(tag){let q=tag+' personal development',e=encodeURIComponent(q);return Promise.allSettled([json('https://www.googleapis.com/books/v1/volumes?q='+e+'&maxResults=30&printType=books').then(d=>(d.items||[]).filter(x=>x.volumeInfo.description).map(x=>({type:'Book · source description',tag,title:x.volumeInfo.title,desc:excerpt(x.volumeInfo.description),url:x.volumeInfo.infoLink||'https://books.google.com/books?id='+x.id}))),podcast(q).then(d=>(d.results||[]).map(x=>({type:'Podcast · show discovery',tag,title:x.collectionName,desc:'Explore this show by '+(x.artistName||'its creator')+' for perspectives on '+tag.toLowerCase()+'. Listen to identify episode ideas.',url:x.collectionViewUrl}))),json('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(tag+' inspirational story')+'&gsrlimit=15&prop=extracts&exintro=1&explaintext=1&exchars=450&format=json&origin=*').then(d=>Object.values(d.query?.pages||{}).filter(x=>x.extract).map(x=>({type:'Story / background · source excerpt',tag,title:x.title,desc:excerpt(x.extract),url:'https://en.wikipedia.org/?curid='+x.pageid})))])}
async function refresh(){if(!active.size){$('status').textContent='Select at least one topic.';return}$('refresh').disabled=true;$('status').textContent='Finding new sources…';let chosen=[...active].sort(()=>Math.random()-.5).slice(0,3);try{let results=(await Promise.all(chosen.map(sources))).flat(),pool=results.filter(x=>x.status==='fulfilled').flatMap(x=>x.value).filter(x=>x.title&&x.url&&x.desc&&!seen.has(x.url));let fresh=[],used=new Set(),types=['Book','Podcast','Story'];for(let i=0;i<6;i++){let candidates=pool.filter(x=>!used.has(x.url)&&x.type.startsWith(types[i%3]));if(!candidates.length)candidates=pool.filter(x=>!used.has(x.url));if(!candidates.length)break;let x=candidates[Math.floor(Math.random()*candidates.length)];fresh.push(x);used.add(x.url)}if(fresh.length){fresh.forEach(x=>seen.add(x.url));let tag=chosen[0];fresh.push({type:'Video / speech · search link',tag,title:'Explore talks on '+tag.toLowerCase(),desc:'Find interviews, motivational speeches and personal stories.',url:'https://www.youtube.com/results?search_query='+encodeURIComponent(tag+' inspirational speech interview')});current=fresh;save('mm-current',current);save('mm-seen',[...seen].slice(-1000));render(current);$('status').textContent=fresh.length-1+' new source discoveries · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+(results.some(x=>x.status==='rejected')?' · some feeds unavailable':'')}else{$('status').textContent='No unseen results returned. Try another topic or refresh later. Previous ideas retained.'}}catch(e){$('status').textContent='Could not reach sources. Previous ideas retained.'}finally{$('refresh').disabled=false}}
$('add').onsubmit=e=>{e.preventDefault();let t=$('topic').value.trim();if(t&&!tags.includes(t)){tags.push(t);active.add(t);save('mm-tags',tags);save('mm-active',[...active]);renderTags()}$('topic').value=''};$('refresh').onclick=refresh;renderTags();render(current.length?current:seeds);$('status').textContent=current.length?'Last discoveries saved on this device.':'Starter ideas — refresh to find live sources.';
</script></html>
